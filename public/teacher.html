<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FacultyCheck — Teacher Portal</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235B4FF0'/%3E%3Cstop offset='1' stop-color='%23372EA8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='44' height='44' rx='13' fill='url(%23g)'/%3E%3Cpath d='M13 15h14M13 22h10M13 29h7' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="brand">

        <svg class="brand-badge" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="badgeGrad2" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#5B4FF0"/>
                    <stop offset="1" stop-color="#372EA8"/>
                </linearGradient>
            </defs>
            <rect width="44" height="44" rx="13" fill="url(#badgeGrad2)"/>
            <path d="M13 15h14M13 22h10M13 29h7" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="33" cy="31" r="4" fill="#B3902F" stroke="#f2effa" stroke-width="1.5"/>
        </svg>

        <div>
            <h2>FacultyCheck</h2>
            <span>Faculty Portal</span>
        </div>

    </div>

    <div class="navbar-actions">
        <a href="/" class="teacher-link">← Home</a>
        <button id="logoutBtn" class="teacher-link logout-link" type="button">Log Out</button>
    </div>

</header>


<main class="dashboard">

    <section class="dashboard-header">

        <span class="eyebrow">FACULTY PORTAL</span>

        <h1 id="welcomeHeading">Manage availability</h1>

        <p>
            Let students know when they can meet you.
        </p>

    </section>


    <section class="dashboard-grid">


        <!-- Profile -->

        <div class="panel">

            <div class="panel-title">
                <div>
                    <h2>Your profile</h2>
                    <p>Visible to students in the directory.</p>
                </div>
            </div>

            <div id="selectedTeacher" class="profile-card"></div>

        </div>


        <!-- Add / edit availability -->

        <div class="panel">

            <div class="panel-title">
                <div>
                    <h2>Add availability</h2>
                    <p>Create a new available time slot.</p>
                </div>
            </div>


            <form id="availabilityForm">

                <label>Date</label>

                <input
                    type="date"
                    id="date"
                    required
                >


                <div class="form-row">

                    <div>
                        <label>Start time</label>

                        <input
                            type="time"
                            id="startTime"
                            required
                        >
                    </div>


                    <div>
                        <label>End time</label>

                        <input
                            type="time"
                            id="endTime"
                            required
                        >
                    </div>

                </div>


                <label>Note (optional)</label>

                <input
                    type="text"
                    id="note"
                    placeholder="e.g. Available for project submissions"
                >


                <button class="primary-btn" type="submit" id="availabilitySubmitBtn">
                    + Add Availability
                </button>

                <button class="secondary-btn" type="button" id="cancelEditBtn" style="display:none;">
                    Cancel edit
                </button>

            </form>

        </div>


    </section>


    <!-- Existing Availability -->

    <section class="panel availability-panel">

        <div class="panel-title">

            <div>
                <h2>Your availability</h2>
                <p>Manage your existing time slots.</p>
            </div>

        </div>

        <div id="teacherAvailability">

            <div class="loading">Loading...</div>

        </div>

    </section>

</main>


<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script src="js/teacher.js"></script>

</body>
</html>
